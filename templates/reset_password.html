{% extends "base.html" %}

{% block title %}Nueva Contraseña — SET-MATCH-GO!{% endblock %}

{% block extra_css %}
  <style>
    body {
      background-color: #111827 !important;
    }

    /* CONTENEDOR GENERAL CON FONDO FIJO DE IMÁGENES */
    .reset-sliding-wrapper {
      position: relative;
      min-height: calc(100vh - 70px);
      margin-top: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* SLIDER DE FONDO DE IMÁGENES ESTACIONALES CON GRADIENTE */
    .reset-bg-slider {
      position: fixed;
      top: 70px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 70px);
      z-index: 1;
      pointer-events: none;
    }

    .bg-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .bg-slide.active {
      opacity: 1;
    }

    .bg-spring {
      background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.88)),
                        url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1600&q=80');
    }
    .bg-summer {
      background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.88)),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');
    }
    .bg-autumn {
      background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.88)),
                        url('https://images.unsplash.com/photo-1507187632231-5beb21a654a2?auto=format&fit=crop&w=1600&q=80');
    }
    .bg-winter {
      background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.88)),
                        url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1600&q=80');
    }

    /* TARJETA PRINCIPAL ESTILO GLASSMORPHISM */
    .reset-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 45px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-sizing: border-box;
      text-align: center;
    }

    .reset-icon-badge {
      width: 56px;
      height: 56px;
      background: rgba(34, 50, 67, 0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #223243;
    }

    .reset-icon-badge svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .reset-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .reset-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group-compact {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group-compact label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input-compact {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
    }

    .form-input-compact:focus {
      border-color: #223243;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(34, 50, 67, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: #64748b;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .btn-auth-submit {
      width: 100%;
      background: #223243;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(34, 50, 67, 0.25);
    }

    .btn-auth-submit:hover {
      background: #1a252f;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(34, 50, 67, 0.35);
    }

    .back-to-login {
      margin-top: 22px;
      font-size: 0.8rem;
    }

    .back-to-login a {
      color: #223243;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .back-to-login a:hover {
      color: #e74c3c;
    }
  </style>
{% endblock %}

{% block content %}
<main class="reset-sliding-wrapper">
  
  <!-- SLIDER DE FONDO DE IMÁGENES ESTACIONALES -->
  <div class="reset-bg-slider" id="resetBgSlider">
    <div class="bg-slide bg-spring active"></div>
    <div class="bg-slide bg-summer"></div>
    <div class="bg-slide bg-autumn"></div>
    <div class="bg-slide bg-winter"></div>
  </div>

  <div class="reset-card">
    
    <div class="reset-icon-badge">
      <svg viewBox="0 0 24 24">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
      </svg>
    </div>

    <h2 class="reset-title">Restablecer Contraseña</h2>
    <p class="reset-subtitle">
      Crea una nueva contraseña segura para recuperar el acceso a tu cuenta.
    </p>

    <form action="{{ url_for('resetear_password', token=token) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

      <div class="form-group-compact">
        <label for="reset-password">Nueva Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="reset-password" name="password" class="form-input-compact" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reset-password', this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="form-group-compact">
        <label for="reset-confirmar">Confirmar Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="reset-confirmar" name="confirmar" class="form-input-compact" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reset-confirmar', this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit">Guardar Nueva Contraseña</button>
    </form>

    <div class="back-to-login">
      <a href="{{ url_for('login') }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver a Iniciar Sesión
      </a>
    </div>

  </div>

</main>

<script>
  /* MOSTRAR / OCULTAR CONTRASEÑA */
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const svg = btn.querySelector('svg');

    if (input.type === 'password') {
      input.type = 'text';
      svg.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;
    } else {
      input.type = 'password';
      svg.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  }

  /* ROTACIÓN AUTOMÁTICA DE FONDO DE IMÁGENES */
  document.addEventListener('DOMContentLoaded', () => {
    let currentSlide = 0;
    const slides = document.querySelectorAll('.bg-slide');

    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 5500);
  });
</script>
{% endblock %}
