{% extends "base.html" %}

{% block title %}Crear Cuenta — SET-MATCH-GO!{% endblock %}

{% block extra_css %}
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 45px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
      box-sizing: border-box;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .auth-subtitle {
      font-size: 14px;
      color: #777777;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222222;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      padding: 12px 42px 12px 14px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background-color: #fafafa;
      box-sizing: border-box;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: #000000;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666666;
    }

    .toggle-password:hover {
      color: #000000;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-auth-submit {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-auth-submit:hover {
      background-color: #222222;
    }

    .auth-footer {
      margin-top: 25px;
      font-size: 13px;
      color: #666666;
    }

    .auth-footer a {
      color: #000000;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
{% endblock %}

{% block content %}
<main class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">CREAR CUENTA</h1>
    <p class="auth-subtitle">Ingresa tus datos para registrarte</p>

    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

      <div class="form-group">
        <label for="nombre">Nombre de Usuario</label>
        <input type="text" id="nombre" name="nombre" class="form-control" style="padding-right: 14px;" placeholder="Ingresa tu nombre" value="{{ nombre or '' }}" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" class="form-control" style="padding-right: 14px;" placeholder="Ingresa tu correo electrónico" value="{{ email or '' }}" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Mostrar u ocultar contraseña">
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- EL NAME COINCIDE CON TU ROUTES.PY: name="confirmar" -->
      <div class="form-group">
        <label for="confirmar">Confirmar Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="confirmar" name="confirmar" class="form-control" placeholder="••••••••" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmar', this)" aria-label="Mostrar u ocultar contraseña">
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit">REGISTRARSE</button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
    </p>
  </div>
</main>

<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const svg = btn.querySelector('svg');

    if (input.type === 'password') {
      input.type = 'text';
      svg.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;
    } else {
      input.type = 'password';
      svg.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  }
</script>
{% endblock %}
