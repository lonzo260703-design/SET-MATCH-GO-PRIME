{% extends "base.html" %}
{% block title %}Crear cuenta — SET-MATCH-GO!{% endblock %}

{% block content %}
  <main class="login-wrapper">
    <div class="login-header">
      <h1>Crear Cuenta</h1>
      <p>Guarda tus resultados y arma tu clóset virtual</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ nombre or '' }}" minlength="2" maxlength="80" placeholder="¿Cómo te llamas?" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" maxlength="120" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
      </div>

      <div class="form-group">
        <label for="confirmar">Confirmar Contraseña</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" placeholder="Repite tu contraseña" required>
      </div>

      <button type="submit" class="btn-login">Crear cuenta</button>
    </form>

    <div class="login-footer">
      ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
    </div>
  </main>
{% endblock %}
