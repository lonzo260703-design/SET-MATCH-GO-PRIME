{% extends "base.html" %}
{% block title %}Iniciar Sesión — SET-MATCH-GO!{% endblock %}

{% block content %}
  <main class="login-wrapper">
    <div class="login-header">
      <h1>Inicio de Sesión</h1>
      <p>Ingresa tus datos para continuar</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="Ingresa tu correo electrónico" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="login-actions">
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <div class="login-footer">
      ¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a>
    </div>
  </main>
{% endblock %}
